# YOLO11-Tiny + PSA (Ultra-Light, Stable)
nc: 2

backbone:
  - [-1, 1, Conv, [16, 3, 2]]          # 0
  - [-1, 1, Conv, [16, 3, 2]]          # 1
  - [-1, 2, C3k2, [32, False, 0.25]]   # 2
  - [-1, 1, Conv, [32, 3, 2]]         # 3
  - [-1, 2, C3k2, [32, False, 0.25]]  # 4
  - [-1, 1, Conv, [64, 3, 2]]         # 5
  - [-1, 2, C3k2, [64, True]]         # 6
  - [-1, 1, Conv, [128, 3, 2]]         # 7  ⬅ nâng nhẹ
  - [-1, 2, C3k2, [128, True]]         # 8
  - [-1, 1, SPPF, [256, 5]]            # 9
  - [-1, 1, C2PSA, [256]]             # 10 ✅ PSA hợp lệ (1 head)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # 128 + 16
  - [-1, 2, C3k2, [8, False]]         # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # 16 + 16
  - [-1, 2, C3k2, [16, False]]         # 16 (P3)

  - [-1, 1, Conv, [16, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [32, False]]         # 19 (P4)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]          # 32 + 128
  - [-1, 1, C3k2, [256, True]]           # 22 (P5) ⬅ không bóp PSA

  - [[16, 19, 22], 1, Detect, [nc]]
